blueprint:
  source_url: "https://raw.githubusercontent.com/tefracky/homeassistant-blueprints/refs/heads/blueprints/automations/notifications.yaml"
  name: Benachrichtigungen (Android + Persistent)
  description: >
    # 📢 Benachrichtigungen

    ## **Version 1.12**

    - 🎨 **Eigenes Icon und Icon-Farbe (nur Android)**
      - Neue optionale Inputs **Icon** (`notify_icon`) und **Icon-Farbe** (`notify_icon_colour`), übernommen aus
        den Blackshome-Vorlagen (Notifications & Announcements 1.5 / State Notifications & Actions 1.8).
      - Erfordert `script.benachrichtigung_senden` ab Blueprint-Version 2.1. Ohne Angabe bleibt alles wie bisher.

    - 🔀 **Modus `parallel` statt `restart`**
      - Jeder Button-Druck (App oder Telegram) löst alle Benachrichtigungs-Automationen aus. Mit `restart` brach
        das laufende Aktionen anderer Automationen ab (z. B. ein gerade schließender Rollladen). Jetzt laufen
        Durchläufe unabhängig nebeneinander (max. 10), wie in State Notifications & Actions 1.8.

    - 🔍 **Mehr Traces:** `trace: stored_traces: 10`

    ## **Version 1.11**

    - 🧹 **Modernisierte Syntax**
      - Trigger `platform: event` → `trigger: event`, Aufrufe `service:` → `action:`.
      - Top-Level `condition:`/`action:` → `conditions:`/`actions:`.
      - `homeassistant: min_version: "2024.10.0"` ist jetzt tatsächlich im Blueprint-Header hinterlegt.

    - 🐞 **Bugfix: Bedingungen für Endzustand**
      - `clear_conditions` werden jetzt beim Lösch-Trigger ausgewertet. Sind sie nicht erfüllt, wird die Benachrichtigung nicht gelöscht – und es wird auch keine neue Benachrichtigung gesendet. Leere Liste = immer erfüllt.

    - ⚠️ **Pflicht-ID bei Lösch-Triggern deutlicher dokumentiert**
      - Die Beschreibung von „Endzustand“ weist jetzt mit Beispiel-YAML darauf hin, dass jeder Lösch-Trigger `id: clear_notification_trigger` braucht. Ohne ID läuft der Trigger stumm in den Zweig „Trigger-Bedingungen“ und die Benachrichtigung wird nie automatisch gelöscht.

    - ⏱️ **Chronometer & Zeitstempel repariert**
      - `notify_chronometer` und `notify_when` werden jetzt in die Werte übersetzt, die `script.benachrichtigung_senden` erwartet (`aus`/`stoppuhr`/`countdown` bzw. ISO-Zeitstempel). Vorher hatte der Chronometer keine Wirkung und `notify_when: true` konnte das Skript abbrechen lassen.
      - Neu: **Countdown-Dauer** (`notify_chronometer_duration`) – > 0 macht aus dem Chronometer einen Countdown.

    - ➕ **Neue optionale Versand-Optionen** (aus `script.benachrichtigung_senden`)
      - **Geräte** (`notify_devices`), **Android-Kanal** (`notify_channel`), **Automatisch ausblenden** (`notify_timeout`), **Persistente HA-Benachrichtigung** (`notify_persistent`).
      - Neue Android-Option **Nur einmal benachrichtigen** (`alert_once`).
      - Alle neuen Inputs haben Defaults, die dem bisherigen Verhalten entsprechen.

    - 🗑️ **`send_to_car` entfernt**
      - Hatte keine Wirkung mehr (`car_ui` ist im Skript immer aktiv). Bestehende Automationen mit diesem Input laufen unverändert weiter, Home Assistant ignoriert den überzähligen Wert.
      - `send_to_work` beschreibt jetzt das tatsächliche Verhalten (keine fest verdrahteten Geräte-IDs mehr im Text).

    - ✂️ **Aufräumen**
      - Ungenutzte Variable `notify_devices` (fest verdrahtete Geräte-IDs) entfernt – die Geräteauswahl erfolgt in `script.benachrichtigung_senden`.
      - Bestehende Inputs, Namen und Defaults unverändert (außer `send_to_car`, s. o.) – bestehende Automationen müssen nicht angepasst werden.

    ## **Version 1.10**

    - 🛡️ **Robustheit und Fehlerbehebung**
      - Es wurden Fallbacks und Standardwerte für mehrere optionale Benachrichtigungsvariablen (`notify_chronometer`, `notify_when`, `notify_url` etc.) hinzugefügt.
      - Dies behebt Template-Warnungen im Home Assistant-Protokoll, die auftreten konnten, wenn diese erweiterten Optionen nicht explizit in der Automation konfiguriert wurden.

    - ➕ **Neue Benachrichtigungsoptionen hinzugefügt**
      - Die Blueprint unterstützt nun vier neue, optionale Felder zur besseren Steuerung von Android-Benachrichtigungen:
        - **`notify_chronometer`**: Zeigt einen Chronometer in der Benachrichtigung an.
        - **`notify_when`**: Fügt einen Zeitstempel hinzu.
        - **`notify_when_relative`**: Ermöglicht relative Zeitangaben.
        - **`notify_url`**: Definiert eine URL, die beim Klick auf die Benachrichtigung geöffnet wird.

    - ⚙️ **Optimierte Skript-Übergabe**
      - Die neuen, optionalen Variablen werden nun korrekt an das zentrale `script.benachrichtigung_senden` übergeben, um die Kompatibilität sicherzustellen und die neuen Funktionen zu aktivieren.

    ## **Version 1.9**

    - 📞 **Telegram-Integration für Aktionen** Die Automation unterstützt nun Callback-Queries von Telegram. Interaktive Buttons in Telegram-Nachrichten können jetzt ebenfalls Aktionen auslösen, genau wie bei den mobilen App-Benachrichtigungen. Hierfür wurde ein neuer Trigger für `telegram_callback` hinzugefügt.
    - 📦 **Zentralisierte Event-Verarbeitung** Die Logik zum Auslesen der Aktions- und Tag-Daten aus den Events (`mobile_app_notification_action` und `telegram_callback`) wurde in ein zentrales Skript `script.benachrichtigung_event_daten_auslesen` ausgelagert. Dies vereinfacht die Wartung und macht die Automation übersichtlicher.
    - ⚙️ **Dynamischer Action-Separator** Der bisher fest codierte Trenner `_action_tag_separator_` wurde durch einen dynamischen Wert aus `input_text.benachrichtigung_action_tag_separator` ersetzt. Dies erhöht die Flexibilität und Standardisierung bei der Erstellung von Action-Strings.


    ## **Version 1.8**

    - 🚀 **Zentralisierung des Benachrichtigungsversands**  
      Die vorher im Blueprint inline hinterlegten Schritte für `persistent_notification.create` und `notify.mobile_app_…` wurden entfernt und durch einen einzigen Aufruf des Skripts `script.benachrichtigung_senden` ersetzt.  
      - Alle relevanten Parameter (`notify_title`, `notify_message`, `notify_data`, `notify_tag`, `send_to_car`, `send_to_work`, `action_button_delete` usw.) werden unverändert an das Skript übergeben.  
      - Die Wartbarkeit und Erweiterbarkeit wurden dadurch deutlich verbessert.

    - 🛠️ **Reduzierung von Code-Duplikationen**  
      Inline-Definitionen der Benachrichtigungslogik sind weggefallen und zentral im Skript gebündelt. Redundante YAML-Blöcke wurden eliminiert.

    ## **Version 1.7**

    - 🛠 **iOS-Handling optimiert**
      - Kleinere Anpassungen bei Variablen und Actions zur Angleichung an neue Struktur, bei der kein tag für die Actions benötigt wird.
      - Durch diese Änderungen werden die Actions auch kompatibel zu iOS-Geräten, die keine Tags beim Klick auf eine Aktion übertragen.

    ## **Version 1.6**

    - 🔄 **Auto-Flag umbenannt und Default geändert**  
      `send_car` heißt jetzt `send_to_car` (Standard: false) und sendet nur noch an das Gerät  
      7b4588bc469f471e30087c5757f2ebf4 (EOS), wenn aktiviert.

    - ➕ **Neue Arbeits-Benachrichtigung**  
      `send_to_work` (Standard: false) ermöglicht nun das Hinzufügen der Arbeitsgeräte  
      e0f19df8be795d8d5867ccf822025697 (Oliver Handy Arbeit) und  
      170f72bbcf6e90b79e776d8511fc2419 (Tina Tablet Arbeit).

    - 🛠 **Notify-Devices-Logik aufgeteilt**  
      Basis-Liste enthält nur Privatgeräte. Arbeits- und Auto-Geräte werden nun getrennt nach ihren Flags hinzugefügt.

    ## **Version 1.5**

    Sende smarte Benachrichtigungen bei definierten Auslösern – sowohl an dein Android-Gerät als auch als permanente Mitteilung in der Home Assistant‑Oberfläche.

    Mit dieser Blueprint‑Vorlage kannst du flexibel Trigger definieren (z. B. Zustände, numerische Werte oder Zeitpunkte) und daraufhin Nachrichten verschicken – inklusive optionaler Sprachansage, interaktiver Aktions‑Buttons und erweiterter Bedingungslogik.

    > **⚙️ Voraussetzung:** Home Assistant **ab Version 2024.10**, damit die neue Listen‑Merge‑Funktion für Trigger verwendet werden kann.

    - **🧲 Trigger & Endzustände**:
      - Nutze den **Trigger Selector**, um beliebige Ereignisse per UI zu definieren.
      - Mehrere Trigger sind gleichzeitig möglich und werden nun **dynamisch flach zusammengeführt** (ohne versteckte UND‑Verschachtelung).
      - Definiere einen Endzustand (z. B. zum Entfernen einer Notification) – inklusive **zusätzlicher Bedingungen**.
      - Unterstützt **Bedingungen beim Triggern und Löschen**, um nur bei bestimmten Konstellationen auszulösen.

    - **📲 Benachrichtigungen**:
      - Nachrichten an Mobilgeräte senden.
      - Als persistente UI‑Mitteilungen anzeigen.
      - Integrierte Text‑to‑Speech und Aktionen möglich.

    - **🕹 Aktions‑Buttons**:
      - Ergänze individuell konfigurierbare Buttons direkt in der Notification.
      - Jeder Button feuert nun als **eigenständiger Trigger**, ohne dass andere Bedingungen gleichzeitig erfüllt sein müssen.

    - **⛔ Bedingungen & Kontrolle**:
      - Lege globale Bedingungen fest, unter denen die Automation überhaupt ausgeführt werden darf.
      - Zusätzliche Bedingungen **nur für Trigger‑ oder Lösch‑Ereignisse** definierbar.


    ## Changelog

    **1.5**: Dynamische Trigger-Listen flach zusammenführen (Trigger Merge)

    - 🆕 **Trigger Merge-Support (HA ≥ 2024.10)**
      - Neue `min_version: '2024.10.0'` für die Blueprint‑Definition hinzugefügt, um die native Listen‑Merge-Funktion zu nutzen.  
      - `dynamic_trigger` und `clear_trigger` werden jetzt per `- triggers: !input …` direkt in die flache `triggers:`-Liste eingefügt, statt verschachtelt – dadurch entfällt die unerwünschte UND‑Logik.

    - ✂️ **Verschachtelte `triggers:`-Blöcke entfernt**
      - Alte nested-Trigger-Abschnitte gelöscht, um Klarheit und Vorhersagbarkeit zu verbessern.

    - ✅ **Button-Events feuern einzeln**
      - Alle mobilen App‑Action-Buttons (`action_button_1`, `action_button_2`, `action_button_3`, `dismiss`) stehen jetzt als eigenständige Trigger-Einträge in der Liste und reagieren punktgenau auf das jeweilige Event.

    - 🛠 **Fehlerbehebung & Kompatibilität**
      - Vermeidet das Verschwinden von Button-Triggern durch falsche Kombination mit dynamischen Trigger-Bedingungen.
      - Blueprint ist ab jetzt nur noch auf HA-Instanzen mit Version 2024.10 oder neuer lauffähig.

    > **Hinweis:** Nach dem Update der Blueprint unter **Konfiguration → Automatisierungen → Neu laden** die betroffenen Automationen neu speichern, damit die geänderten Trigger korrekt aktiviert werden.


    **1.4**: Zusätzliche Bedingungen für Trigger- und Endzustand

    - ✅ **Neue Bedingungsoptionen hinzugefügt:**
      - `trigger_conditions`: Ermöglicht es, nur dann Benachrichtigungen zu senden, wenn zusätzliche Bedingungen beim Trigger erfüllt sind.
      - `clear_conditions`: Ermöglicht das automatische Löschen von Benachrichtigungen nur bei erfüllten Bedingungen (z. B. Zustand + Zeitspanne + Anwesenheit).

    - 🧠 **Intelligentere Ablaufsteuerung:**
      - Die Bedingungen wurden in die `choose:`-Logik integriert und verhindern zuverlässig das Ausführen der Hauptaktionen bei nicht erfüllten Voraussetzungen.

    - 🧼 **Klarere Struktur:**
      - Trennung der Bedingungslogik für Trigger und Endzustände – mehr Flexibilität, bessere Lesbarkeit.

    - 🛠 **Fehlerbehebung:**
      - Korrektur der Trigger-ID für den Button „Löschen“ zu `clear_notification_button`, um Konflikte mit `clear_notification_trigger` zu vermeiden.


    **1.3**: Verbesserungen an den Benachrichtigungsoptionen und der Benutzerfreundlichkeit

    - 🛠 **Neue Auswahl für Benachrichtigungsoptionen:**
      Die Auswahl für die mobile App-Benachrichtigungsoption (`include_notify`) wurde entfernt. Es werden jetzt immer Benachrichtigungen an Mobilgeräte gesendet.

    - ✏️ **Standardwerte aktualisiert:**
      Standardwerte für Titel und Nachricht der Benachrichtigung (`notify_title`, `notify_message`) wurden hinzugefügt, um die Konfiguration zu erleichtern.

    - 📱 **Android-spezifische Optionen erweitert:**
      Zusätzliche Optionen für Android-Benachrichtigungen (`notify_data`) wie Hochpriorität und feste Benachrichtigungen wurden hinzugefügt.

    - 🔧 **Verbesserte Struktur:**
      Die YAML-Definition wurde optimiert, um die Lesbarkeit und Wartbarkeit zu verbessern.

    **1.2**: Benachrichtigungen senden und löschen an Skripte ausgelagert

    - 🗑 **Refaktorierte Löschlogik:**
      Statt der bisherigen, manuellen Abfolge zum Löschen persistenter Benachrichtigungen wird nun das zentrale Skript `script.benachrichtigung_loschen` aufgerufen. Dies sorgt für einen klareren Ablauf und verbesserte Wartbarkeit.

    - 🔔 **Modularisierte Benachrichtigungsroutine:**
      Ein neuer Choose-Zweig „Check if notification is enabled“ überprüft, ob mobile App-Benachrichtigungen aktiviert sind und ob Geräte vorhanden sind, und löst dann das Skript `script.benachrichtigung_senden` aus – inklusive Übergabe aller relevanten Parameter wie Titel, Nachricht, Daten und Aktions-Buttons.

    - 🧹 **Bereinigung der Legacy-Struktur:**
      Der bisher verwendete `default`-Block, der separate Zuständigkeiten für Gerätebenachrichtigungen und das Erstellen persistenter Nachrichten innehatte, wurde komplett entfernt, um Redundanzen abzubauen und die Logik zu vereinheitlichen.

    - ⚙️ **Integrierte benutzerdefinierte Aktionen:**
      Die Option, benutzerdefinierte Aktionen auszuführen, bleibt erhalten – in den neuen Benachrichtigungs-Branch integriert, um den Ablauf zu vereinheitlichen und die Konfiguration übersichtlicher zu gestalten.

    **1.1**: Aktionen zu Benachrichtigungen hinzugefügt

    - ✨ Umstellung auf `trigger:` Selector – mehr Flexibilität, bessere UI.

    - ➕ Unterstützung für **mehrere Trigger** gleichzeitig.

    - 🧼 Entfernt: Komplexe manuelle Zustandstyp-Auswahl.

    - 🧽 Entfernt: `time_delay_state`, da dies direkt im Trigger möglich ist (`for:`).

    - 🧩 Trigger & Endzustand in einer Gruppe zusammengeführt.

    **Vielen Dank an die ursprünglichen Entwickler:**
      - [Notifications and Announcements](https://gist.github.com/Blackshome/180ca4a24af81cd5d843acfc039039bc)
      - [State Notification Actions](https://gist.github.com/Blackshome/06f6f28e76299267b813dac48608f549)
      - **Spende für den Entwickler:** [Hier klicken](https://www.paypal.com/donate/?hosted_button_id=WAZS3QSDTPGA8)
      - **FAQ & Hilfe:** [Zum Community-Thread](https://community.home-assistant.io/t/notifications-announcements/728100/2?u=blacky)

  domain: automation
  homeassistant:
    min_version: "2024.10.0"
  input:
    trigger_section:
      name: "🧲 Trigger & Endzustand"
      icon: mdi:toggle-switch
      collapsed: false
      input:
        dynamic_trigger:
          name: Trigger-Auslöser
          description: >
            Wähle die Trigger aus, die deine Automation starten sollen.
            Du kannst beliebige Trigger-Typen verwenden (z. B. Zustände, numerische Werte, Zeitpunkte, Events, etc.).
            Mehrere Trigger sind möglich.
          selector:
            trigger:
        clear_trigger:
          name: Endzustand (optional)
          description: |
            Lege optional Trigger für das **automatische Löschen** der Benachrichtigung fest.
            Z. B. wenn eine Entität wieder den Zustand *OK* erreicht.

            ⚠️ **Wichtig:** Jeder Trigger hier braucht zwingend **`id: clear_notification_trigger`**
            (im UI: Trigger → ⋮ → „Trigger-ID bearbeiten“). Ohne ID wird der Trigger wie ein normaler
            Auslöser behandelt und die Benachrichtigung **nie automatisch gelöscht**.

            Beispiel:

            ```yaml
            - trigger: state
              entity_id: cover.garagentor
              to: closed
              id: clear_notification_trigger
            ```
          default: []
          selector:
            trigger:
    device_notify_settings:
      name: "Benachrichtigungen (Mobil und Persistent)"
      icon: mdi:devices
      collapsed: true
      input:
        notify_title:
          name: Benachrichtigungstitel
          description: >
            Gib den Titel der Benachrichtigung ein, der sowohl für die Android-Benachrichtigung als auch für die persistente Anzeige in der UI verwendet wird.
          default: "📢 Gebe hier den Benachrichtigungstitel ein"
          selector:
            text:
        notify_message:
          name: Benachrichtigungsnachricht
          description: >
            Gib die Nachricht ein, die für die Benachrichtigung ausgesendet wird – sowohl als Android-Meldung als auch in der persistenten Anzeige.
          default: "Gebe hier die Benachrichtigungsnachricht ein 🙂"
          selector:
            text:
              multiline: true
        notify_data:
          name: "Android-spezifische Optionen (Optional)"
          description: >
            **Optionen für Android (Optional):**
            - **Hochpriorität**: Benachrichtigungen werden sofort zugestellt, um wichtige Meldungen umgehend zu übermitteln.
            - **Feste Benachrichtigung**: Wichtige Meldungen bleiben in der Benachrichtigungsleiste, bis sie aktiv entfernt werden.
            - **Nur einmal benachrichtigen**: Bei Aktualisierung derselben Benachrichtigung kein erneuter Ton/Vibration.
            - **Benachrichtigungskanal**: Organisiert verschiedene Benachrichtigungseinstellungen (Töne, Vibration etc.).
              Diese Option wird immer genutzt und erfordert die Eingabe eines Kanalnamens.
          default: []
          selector:
            select:
              multiple: true
              options:
                - label: Hochpriorität
                  value: "high_priority"
                - label: Feste Benachrichtigung
                  value: "sticky"
                - label: Nur einmal benachrichtigen
                  value: "alert_once"
        notify_tag:
          name: Benachrichtigungskanal – Android & Persistent
          description: >
            Gib den Namen des Benachrichtigungskanals ein.
            Dieser Kanal wird auch als Tag für die persistente Benachrichtigung verwendet und – falls noch nicht vorhanden – beim ersten Senden der Benachrichtigung erstellt.
          default: "default_channel"
          selector:
            text:
        notify_chronometer:
          name: "Chronometer anzeigen"
          description: >
            Zeigt oben in der Benachrichtigung eine laufende Zeit an (nur Android).
            Standard ist eine Stoppuhr ab dem Sendezeitpunkt; mit einer **Countdown-Dauer** > 0 wird daraus ein Countdown.
          default: false
          selector:
            boolean:
        notify_chronometer_duration:
          name: "Countdown-Dauer (Sekunden)"
          description: >
            Nur relevant, wenn „Chronometer anzeigen“ aktiv ist. 0 = Stoppuhr (zählt hoch),
            > 0 = Countdown über diese Dauer (z. B. 1800 für 30 Minuten).
          default: 0
          selector:
            number:
              min: 0
              max: 86400
              unit_of_measurement: s
              mode: box
        notify_when:
          name: "Zeitstempel anzeigen"
          description: "Zeigt den Sendezeitpunkt als Zeitstempel in der Benachrichtigung an (nur Android). Wird ignoriert, wenn der Chronometer aktiv ist."
          default: false
          selector:
            boolean:
        notify_when_relative:
          name: "Relativer Zeitstempel"
          description: >
            Relativer Zeitstempel in **Sekunden** (nur Android), wird unverändert an `script.benachrichtigung_senden` übergeben.
            Leer oder 0 = aus. Wird ignoriert, wenn Chronometer oder Zeitstempel aktiv sind.
          default: ""
          selector:
            text:
        notify_url:
          name: "Klick-Aktion URL"
          description: "URL, die beim Klick auf die Benachrichtigung geöffnet wird."
          default: ""
          selector:
            text:
        send_to_work:
          name: "Arbeits-Benachrichtigung aktivieren"
          description: >
            Wenn aktiviert (Standard: false), nimmt `script.benachrichtigung_senden` zusätzlich die Arbeitsgeräte
            in die Benachrichtigungsliste auf. Die Geräteliste wird zentral im Skript gepflegt.
            Wird ignoriert, wenn unter „Geräte“ eine eigene Auswahl getroffen wurde.
          default: false
          selector:
            boolean:
        notify_devices:
          name: "Geräte (optional)"
          description: >
            Nur an diese Mobile-App-Geräte senden. Leer = Standardliste aus `script.benachrichtigung_senden`.
          default: []
          selector:
            device:
              multiple: true
              filter:
                - integration: mobile_app
        notify_channel:
          name: "Android-Kanal (optional)"
          description: >
            Eigener Android-Benachrichtigungskanal. Leer = wie der Benachrichtigungskanal/Tag (bisheriges Verhalten).
          default: ""
          selector:
            text:
        notify_timeout:
          name: "Automatisch ausblenden nach (Sekunden)"
          description: "Zeit, nach der die Benachrichtigung vom Handy verschwindet. 0 = bleibt stehen."
          default: 0
          selector:
            number:
              min: 0
              max: 86400
              unit_of_measurement: s
              mode: box
        notify_persistent:
          name: "Persistente HA-Benachrichtigung"
          description: "Zusätzlich eine persistente Benachrichtigung in Home Assistant anlegen."
          default: true
          selector:
            boolean:
        notify_icon:
          name: "Icon (optional, nur Android)"
          description: "Ersetzt das Home-Assistant-Icon in der Benachrichtigung. Leer = Standard-Icon."
          default: ""
          selector:
            icon:
        notify_icon_colour:
          name: "Icon-Farbe (optional, nur Android)"
          description: "Farbe des Icons. Leer lassen für die Standardfarbe."
          default: []
          selector:
            color_rgb:
    action_settings:
      name: "Aktions-Buttons"
      icon: mdi:gesture-tap
      collapsed: true
      input:
        include_action_buttons:
          name: Optionen für Aktions-Buttons (Optional)
          description: >
            Aktiviere die Aktions-Buttons, die in der Benachrichtigung angezeigt werden sollen, um Aktionen per Klick auszulösen.

            **Hinweis**: Es ist nicht zwingend erforderlich, Aktions-Buttons zu verwenden, um eine Aktion auszuführen.
            Falls du lieber eine automatische Aktion nutzen möchtest, aktiviere stattdessen eine der **Automatischen Aktionen** im untenstehenden Abschnitt.

            ⚠️ Gib die Namen aller aktivierten **Aktions-Buttons** an, einschließlich der Löschen-Schaltfläche.
            Fehlt eine Angabe, könnte dies dazu führen, dass die Automation nicht korrekt funktioniert.
          default: []
          selector:
            select:
              options:
                - label: Aktions-Button 1 aktivieren
                  value: "enable_action_button_1"
                - label: Aktions-Button 2 aktivieren
                  value: "enable_action_button_2"
                - label: Aktions-Button 3 aktivieren
                  value: "enable_action_button_3"
              multiple: true
        action_button_1:
          name: Aktions-Button 1
          description: >
            Gib den Namen der Schaltfläche an, die in der Benachrichtigung angezeigt wird.
            Diese Schaltfläche löst alle Aktionen aus, die unter **Aktion 1** im Abschnitt "Automatische Aktionen" definiert sind.
          default: []
          selector:
            text:
        action_button_2:
          name: Aktions-Button 2
          description: >
            Gib den Namen der Schaltfläche an, die in der Benachrichtigung angezeigt wird.
            Diese Schaltfläche löst alle Aktionen aus, die unter **Aktion 2** im entsprechenden Abschnitt definiert sind.
          default: []
          selector:
            text:
        action_button_3:
          name: Aktions-Button 3
          description: >
            Gib den Namen der Schaltfläche an, die in der Benachrichtigung angezeigt wird.
            Diese Schaltfläche löst alle Aktionen aus, die unter **Aktion 3** im entsprechenden Abschnitt definiert sind.
          default: []
          selector:
            text:
        action_button_delete:
          name: Löschen-Schaltfläche
          description: >
            Gib den Namen der Löschen-Schaltfläche an, die in der Benachrichtigung angezeigt wird.
            Diese Schaltfläche löscht alle Benachrichtigungen, die mit dem angegebenen **Benachrichtigungskanal** verbunden sind.
            Sie wird automatisch zur Benachrichtigung hinzugefügt, falls ein Aktions-Button aktiviert wurde.
          default: Löschen
          selector:
            text:
    auto_action_settings:
      name: "Automatische Aktionen"
      icon: mdi:code-tags
      collapsed: true
      input:
        action_1:
          name: Aktion 1
          description: >
            Gib die Aktionen ein, die ausgeführt werden sollen, wenn die Entität den definierten Zustand erreicht.
            Diese Aktionen sind ebenso mit der **Aktions-Button 1** verknüpft.
          default: []
          selector:
            action:
        action_2:
          name: Aktion 2
          description: >
            Gib die Aktionen ein, die ausgeführt werden sollen, wenn die Entität den definierten Zustand erreicht.
            Diese Aktionen sind ebenso mit der **Aktions-Button 2** verknüpft.
          default: []
          selector:
            action:
        action_3:
          name: Aktion 3
          description: >
            Gib die Aktionen ein, die ausgeführt werden sollen, wenn die Entität den definierten Zustand erreicht.
            Diese Aktionen sind ebenso mit der **Aktions-Button 3** verknüpft.
          default: []
          selector:
            action:
    custom_actions_settings:
      name: "Benutzerdefinierte Aktionen"
      icon: mdi:code-tags
      collapsed: true
      input:
        include_custom_actions:
          name: Benutzerdefinierte Aktionsoption (Optional)
          description: >
            Passe deine Automation mit beliebigen Aktionen an.
            Zum Beispiel können spezielle Durchsagen über ausgewählte Lautsprecher ausgeführt werden.
          default: disable_custom_actions
          selector:
            select:
              options:
                - label: Benutzerdefinierte Aktionen aktivieren
                  value: "enable_custom_actions"
                - label: Benutzerdefinierte Aktionen deaktivieren
                  value: "disable_custom_actions"
        custom_actions:
          name: Benutzerdefinierte Aktionen
          description: >
            Gib die benutzerdefinierten Aktionen ein, die ausgeführt werden sollen.
          default: []
          selector:
            action:
    conditions_settings:
      name: "Bedingungen"
      icon: mdi:earth
      collapsed: true
      input:
        global_conditions:
          name: Globale Bedingungen
          description: >
            Gib globale Bedingungen ein, die erfüllt sein müssen, damit die Automation ausgeführt wird.
          default: []
          selector:
            condition:
        trigger_conditions:
          name: Bedingungen für Trigger-Auslöser
          description: >
            Gib Bedingungen ein, die beim Auslösen der Trigger zusätzlich erfüllt sein müssen.
          default: []
          selector:
            condition:
        clear_conditions:
          name: Bedingungen für Endzustand
          description: >
            Gib Bedingungen ein, die beim Eintreten des Endzustands zusätzlich erfüllt sein müssen.
          default: []
          selector:
            condition:

mode: parallel
max: 10

trace:
  stored_traces: 10

variables:
  notify_title: !input notify_title
  notify_message: !input notify_message
  notify_data: !input notify_data
  notify_tag: !input notify_tag
  notify_chronometer: !input notify_chronometer
  notify_when: !input notify_when
  notify_when_relative: !input notify_when_relative
  notify_url: !input notify_url
  notify_chronometer_duration: !input notify_chronometer_duration
  send_to_work: !input send_to_work
  notify_devices: !input notify_devices
  notify_channel: !input notify_channel
  notify_timeout: !input notify_timeout
  notify_persistent: !input notify_persistent
  notify_icon: !input notify_icon
  notify_icon_colour: !input notify_icon_colour
  include_action_buttons: !input include_action_buttons
  action_button_1: !input action_button_1
  action_button_2: !input action_button_2
  action_button_3: !input action_button_3
  action_button_delete: !input action_button_delete
  action_1: !input action_1
  action_2: !input action_2
  action_3: !input action_3
  include_custom_actions: !input include_custom_actions
  custom_actions: !input custom_actions
  global_conditions: !input global_conditions
  trigger_conditions: !input trigger_conditions
  clear_conditions: !input clear_conditions

triggers:
  # Faltet alle Einträge aus dynamic_trigger an den Anfang deiner Triggerliste
  - triggers: !input dynamic_trigger

  # Feste Button‑Events
  - trigger: event
    event_type: mobile_app_notification_action
    id: action_button_app
  - trigger: event
    event_type: telegram_callback
    id: action_button_telegram

  # Faltet alle Einträge aus clear_trigger ans Ende der Liste
  - triggers: !input clear_trigger

conditions: !input global_conditions

actions:
  - choose:
      - alias: "Prüfe, ob Aktions-Button gedrückt wurde"
        conditions:
          - condition: trigger
            id:
              - action_button_app
              - action_button_telegram
        sequence:
          - alias: "Unterskript aufrufen und action/tag zurückgeben"
            action: script.benachrichtigung_event_daten_auslesen
            data:
              event_data: "{{ trigger.event.data }}"
            response_variable: result
          - variables:
              action: "{{ result.action }}"
              tag: "{{ result.tag }}"
          - condition: template
            value_template: "{{ tag == notify_tag }}"
          - choose:
              - alias: "Prüfe, ob Aktions-Button 1 gedrückt wurde"
                conditions:
                  - condition: template
                    value_template: "{{ action == 'action_button_1' }}"
                sequence: !input action_1
              - alias: "Prüfe, ob Aktions-Button 2 gedrückt wurde"
                conditions:
                  - condition: template
                    value_template: "{{ action == 'action_button_2' }}"
                sequence: !input action_2
              - alias: "Prüfe, ob Aktions-Button 3 gedrückt wurde"
                conditions:
                  - condition: template
                    value_template: "{{ action == 'action_button_3' }}"
                sequence: !input action_3
              - alias: "Prüfe, ob Löschen-Schaltfläche gedrückt wurde"
                conditions:
                  - condition: template
                    value_template: "{{ action == 'dismiss' }}"
                sequence:
                  - action: script.benachrichtigung_loschen
                    data:
                      notify_tag: "{{ notify_tag }}"
      - alias: "Prüfe, ob Endzustand erreicht wurde (Lösch-Trigger)"
        conditions:
          - condition: trigger
            id: clear_notification_trigger
        sequence:
          # Bewusst in der Sequenz statt in "conditions": sonst fiele ein Lösch-Trigger mit
          # unerfüllten clear_conditions in den Hauptzweig und würde eine Benachrichtigung senden.
          - alias: "Bedingungen für Endzustand prüfen"
            condition: and
            conditions: !input clear_conditions
          - action: script.benachrichtigung_loschen
            data:
              notify_tag: "{{ notify_tag }}"
      - alias: "Prüfe Trigger-Bedingungen für Hauptbenachrichtigung"
        conditions: !input trigger_conditions
        sequence:
          - action: script.benachrichtigung_senden
            data:
              notify_title: !input notify_title
              notify_message: !input notify_message
              notify_data: !input notify_data
              notify_tag: !input notify_tag
              # Boolean-Inputs auf die Werte übersetzen, die script.benachrichtigung_senden erwartet
              notify_chronometer: >-
                {{ ('countdown' if notify_chronometer_duration | int(0) > 0 else 'stoppuhr')
                   if notify_chronometer else 'aus' }}
              notify_chronometer_duration: "{{ notify_chronometer_duration | int(0) }}"
              notify_when: "{{ now().isoformat() if notify_when else '' }}"
              notify_when_relative: "{{ notify_when_relative | int(0) }}"
              notify_url: !input notify_url
              send_to_work: !input send_to_work
              notify_devices: !input notify_devices
              notify_channel: !input notify_channel
              notify_timeout: !input notify_timeout
              notify_persistent: !input notify_persistent
              notify_icon: !input notify_icon
              notify_icon_color: !input notify_icon_colour
              action_button_delete: !input action_button_delete
              additional_message_actions: >
                {% set actions = [] %}
                {% if 'enable_action_button_1' in include_action_buttons %}
                  {% set actions = actions + [{ 'action': 'action_button_1' + states('input_text.benachrichtigung_action_tag_separator') + notify_tag, 'title': action_button_1 }] %}
                {% endif %}
                {% if 'enable_action_button_2' in include_action_buttons %}
                  {% set actions = actions + [{ 'action': 'action_button_2' + states('input_text.benachrichtigung_action_tag_separator') + notify_tag, 'title': action_button_2 }] %}
                {% endif %}
                {% if 'enable_action_button_3' in include_action_buttons %}
                  {% set actions = actions + [{ 'action': 'action_button_3' + states('input_text.benachrichtigung_action_tag_separator') + notify_tag, 'title': action_button_3 }] %}
                {% endif %}
                {{ actions }}
